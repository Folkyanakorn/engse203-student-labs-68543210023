name: Week 12 Check
on: [push]
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs/week-12/source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install --prefix api && npm install --prefix frontend
      - run: npm test